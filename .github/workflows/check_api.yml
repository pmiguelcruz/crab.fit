name: API Checks

on:
  pull_request:
    paths:
      - api/**
      - .github/workflows/check_api.yml
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/check_api.yml

# Fail on warnings
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v3
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy
      - run: cargo +1.92.0 clippy --locked --workspace --all-targets --features sql-adaptor
